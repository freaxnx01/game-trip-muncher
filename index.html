<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>

@keyframes ledpulse{0%,100%{box-shadow:0 0 7px 1px #86e01e;}50%{box-shadow:0 0 3px 0 #86e01e;}}
</style>
</helmet>
<div style="min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px 16px;background:radial-gradient(120% 90% at 50% 10%, #221d17 0%, #131009 70%);font-family:'VT323',monospace;">

          <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 105% 100% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%);"></div>
          <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg, rgba(255,255,255,.06) 0%, transparent 22%);"></div>
        </sc-if>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 6px 4px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="font-size:20px;letter-spacing:2px;color:#565045;font-weight:bold;">OKTA-80</div>
        <div style="font-size:13px;color:#7d7663;font-family:Helvetica,Arial,sans-serif;letter-spacing:1px;">HOME COMPUTER SYSTEM</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <div style="width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #8a8170, #5c5546);box-shadow:inset 0 -2px 4px rgba(0,0,0,.4);"></div>
        <div style="width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #8a8170, #5c5546);box-shadow:inset 0 -2px 4px rgba(0,0,0,.4);"></div>

  </div>
  <div style="font-size:17px;letter-spacing:1px;color:#8a8170;text-align:center;line-height:1.5;">ARROWS / WASD = STEER &nbsp;·&nbsp; SPACE = START &nbsp;·&nbsp; M = SOUND &nbsp;·&nbsp; TOUCH: DRAG ON SCREEN &nbsp;·&nbsp; THE SPIDER FIRES AUTOMATICALLY</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;color&quot;,&quot;green&quot;,&quot;amber&quot;],&quot;default&quot;:&quot;color&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Screen&quot;},&quot;scanlines&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Screen&quot;},&quot;difficulty&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;kids&quot;,&quot;normal&quot;,&quot;hard&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Game&quot;}}">

      { n: 'ST.LOUIS', p: [160, 98] },

      { n: 'GRAND CANYON', p: [62, 106] },

        g.fillStyle = bright ? P.trail : P.routeDot;
        g.globalAlpha = bright ? 1 : 0.8;
        for (let d = 0; d <= pp.len; d += 5) { const q = this.pathPoint(pp, d); g.fillRect(q.x - 1, q.y - 1, bright ? 3 : 2, bright ? 3 : 2); }
        g.globalAlpha = 1;
      });
      const dst = this.cities[5].p;
      g.fillStyle = P.muncher; g.fillRect(dst[0] - 2, dst[1] - 2, 5, 5);
    }
  }
  drawDecor(P) {
    const g = this.ctx;
    g.lineWidth = 3; g.strokeStyle = P.fringe; g.globalAlpha = 0.8;
    this.decor.forEach(pts => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1] + 1) : g.moveTo(p[0], p[1] + 1)); g.stroke(); });
    g.lineWidth = 1.6; g.strokeStyle = P.state; g.globalAlpha = 1;
    this.decor.forEach(pts => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); });
  }
  drawTrail(P) {
    const g = this.ctx;
    g.fillStyle = P.trail;
    const n = Math.floor(this.carDist / 8);
    for (let i = 0; i <= n; i++) {
      if (this.eaten.has(i)) continue;
      const p = this.pathPoint(this.path, i * 8);
      g.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }
  }
  drawHud(P) {
    this.txt('SCORE ' + String(this.score).padStart(6, '0'), 6, 9, 12, 'left', 1, P.hud);
    this.txt('DAY ' + (this.stage + 1) + '/5', 140, 9, 12, 'center', 1, P.hud);
    this.txt('TRIES ' + this.tries, 274, 9, 12, 'right', 1, P.hud);
  }
  drawPlayfield(P) {
    const g = this.ctx;
    this.drawDecor(P);
    const end = this.pathPoint(this.path, this.path.len);
    g.fillStyle = P.muncher; g.fillRect(end.x - 2, end.y - 2, 5, 5);
    this.txt(this.cities[this.stage + 1].n, end.x, end.y - 10, 10, 'center', 0.9, P.hud);
    this.drawTrail(P);
  }
  // ---------- draw ----------
  draw() {
    const g = this.ctx, P = this.pal();
    g.fillStyle = P.bg; g.fillRect(0, 0, this.W, this.H);
    const cx = this.W / 2;
    if (this.mode === 'boot') {
      let budget = Math.floor(this.bootChars);
      let y = 20;
      g.fillStyle = P.hud;
      g.font = '13px VT323, monospace'; g.textAlign = 'left'; g.textBaseline = 'middle';
      for (const line of this.bootLines) {
        const take = Math.max(0, Math.min(line.length, budget));
        g.fillText(line.slice(0, take), 10, y);
        budget -= line.length + 6; y += 15;
        if (budget < 0) break;
      }
      if (this.blink(3)) g.fillRect(10, y - 5, 7, 10);
    } else if (this.mode === 'title') {
      this.drawUsaMap(P, { route: true });
      this.txt('TRIP MUNCHER', cx, 16, 22, 'center', 1, P.hud);
      this.txt('THE VACATION SABOTAGE GAME', cx, 32, 11, 'center', 0.85, P.hud);
      this.txt('HI ' + String(this.hi).padStart(6, '0'), 274, 16, 11, 'right', 0.85, P.hud);
      this.banner(P, this.blink(1.2) ? 'TOTAL MILES 2408' : 'PRESS SPACE OR TAP TO START');
      this.txt('(C)1983 OKTA SOFT INC.', cx, 185, 10, 'center', 0.55, P.hud);
    } else if (this.mode === 'intro') {
      this.drawUsaMap(P, { route: true, highlight: this.stage });
      this.txt('DAY ' + (this.stage + 1) + '/5', 6, 9, 12, 'left', 1, P.hud);
      this.txt('WEAPON: ' + (this.weapon() === 'spider' ? 'SPIDER' : 'MUNCHER'), 274, 9, 12, 'right', 1, P.hud);
      if (this.modeT > 1.6 && this.blink(3)) this.txt('GO!', cx, 40, 20, 'center', 1, P.hud);
      this.banner(P, 'DAY ' + (this.stage + 1) + ': ' + this.cities[this.stage].n + ' TO ' + this.cities[this.stage + 1].n);
    } else if (this.mode === 'play' || this.mode === 'chomp') {
      this.drawPlayfield(P); this.drawHud(P);
      const cp = this.pathPoint(this.path, this.carDist);
      g.fillStyle = P.bullet;
      this.bullets.forEach(b => g.fillRect(b.x - 2, b.y - 2, 4, 4));
      if (this.mode === 'play') {
        if (!this.panic || this.blink(8)) this.drawCar(g, cp.x, cp.y, Math.cos(cp.ang) > 0, P.car);
        if (this.panic) this.txt('!', cp.x, cp.y - 11, 12, 'center', 1, P.accent);
        if (this.weapon() === 'spider') this.drawSpider(g, this.mx, this.my, P);
        else this.drawMuncher(g, this.mx, this.my, this.mAng, this.mouth, P.muncher);
      } else {
        if (this.weapon() === 'spider') {
          this.drawBurst(g, cp.x, cp.y, P.trail, Math.min(1, this.modeT * 1.5));
          this.drawSpider(g, this.mx, this.my, P);
        } else {
          if (this.modeT < 0.5 && this.blink(10)) this.drawCar(g, cp.x, cp.y, Math.cos(cp.ang) > 0, P.car);
          this.drawMuncher(g, cp.x, cp.y, cp.ang + Math.PI, 0.5 + 0.5 * Math.sin(this.t * 14), P.muncher);
        }
        this.banner(P, this.weapon() === 'spider' ? 'DIRECT HIT!!' : 'CHOMP!!');
      }
    } else if (this.mode === 'fail') {
      this.drawPlayfield(P); this.drawHud(P);
      const cp = this.pathPoint(this.path, this.path.len);
      this.drawCar(g, cp.x, cp.y, false, P.car);
      this.banner(P, 'THE WAGON MADE IT TO ' + this.cities[this.stage + 1].n + ' - TRIES ' + this.tries);
      if (this.blink()) this.txt('PRESS SPACE OR TAP TO RETRY', cx, 40, 13, 'center', 1, P.hud);
    } else if (this.mode === 'gameover') {
      this.drawUsaMap(P, { route: true });
      this.txt('GAME OVER', cx, 20, 24, 'center', 1, P.hud);
      this.txt('FINAL SCORE ' + String(this.score).padStart(6, '0'), cx, 38, 12, 'center', 1, P.hud);
      this.banner(P, 'DAD DROVE ALL 2408 MILES. GROSS.');
      if (this.blink()) this.txt('PRESS SPACE OR TAP', cx, 185, 11, 'center', 0.9, P.hud);
    } else if (this.mode === 'win') {
      this.drawUsaMap(P, { route: false });
      this.txt('ROUTE 100% EATEN', cx, 18, 20, 'center', 1, P.hud);
      this.txt('RUSTY 1 - DAD 0', cx, 36, 13, 'center', 1, P.hud);
      this.txt('FINAL SCORE ' + String(this.score).padStart(6, '0'), cx, 50, 12, 'center', 1, P.hud);
      this.banner(P, 'VACATION CANCELLED FOREVER');
      if (this.blink()) this.txt('PRESS SPACE OR TAP', cx, 185, 11, 'center', 0.9, P.hud);
      const mxx = (this.t * 50) % (this.W + 80) - 40;
      this.drawMuncher(g, mxx, 100, 0, 0.5 + 0.5 * Math.sin(this.t * 14), P.muncher);
    }
  }
}
</script>

<script>
// Fullscreen toggle for #game-nav (freaxnx01.github.io issue #25).
// Self-contained: inserts a button into whatever #game-nav exists and
// re-asserts it for 10 s, so dc bundles that replaceWith() the DOM keep it.
(function () {
  var d = document;
  if (!(d.fullscreenEnabled || d.webkitFullscreenEnabled)) return;
  function fsEl() { return d.fullscreenElement || d.webkitFullscreenElement || null; }
  function sync() {
    var b = d.getElementById("fs-toggle");
    if (!b) return;
    var on = !!fsEl();
    b.textContent = on ? "✕" : "⛶";
    b.title = on ? "Exit fullscreen" : "Fullscreen";
    b.setAttribute("aria-label", b.title);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  }
  function toggle() {
    var p;
    try {
      if (fsEl()) {
        p = (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      } else {
        var r = d.documentElement;
        p = (r.requestFullscreen || r.webkitRequestFullscreen).call(r);
      }
    } catch (e) {}
    if (p && p.catch) p.catch(function () {});
  }
  function sep() {
    var s = d.createElement("span");
    s.setAttribute("aria-hidden", "true");
    s.style.cssText = "color:#5a6072";
    s.textContent = "·";
    return s;
  }
  function ensure() {
    var nav = d.getElementById("game-nav");
    if (!nav || d.getElementById("fs-toggle")) return;
    var b = d.createElement("button");
    b.id = "fs-toggle";
    b.type = "button";
    b.style.cssText = "background:none;border:0;padding:0;margin:0;cursor:pointer;color:#8fd8e8;font:inherit;line-height:1";
    // blur(): keyboard games would otherwise re-trigger the focused button
    // with Enter/Space and silently toggle fullscreen back.
    b.addEventListener("click", function () { toggle(); b.blur(); });
    var badge = d.getElementById("version-badge");
    if (badge && badge.parentNode === nav) {
      nav.insertBefore(b, badge.nextSibling);
      nav.insertBefore(sep(), b);
    } else {
      nav.insertBefore(sep(), nav.firstChild);
      nav.insertBefore(b, nav.firstChild);
    }
    sync();
  }
  d.addEventListener("fullscreenchange", sync);
  d.addEventListener("webkitfullscreenchange", sync);
  d.addEventListener("DOMContentLoaded", ensure);
  window.addEventListener("load", ensure);
  ensure();
  var n = 0, iv = setInterval(function () { ensure(); if (++n >= 40) clearInterval(iv); }, 250);
})();
</script>
